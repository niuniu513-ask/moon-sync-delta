name: MoonBit checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Check, build, test
        run: |
          moon check --deny-warn --target all
          moon build --target all
          moon test --deny-warn --target all
      - name: Run complete synchronization scenarios
        run: moon run examples/demo
      - name: Independent file and hash validation
        run: |
          moon build cmd/files --target js --release --deny-warn
          python3 scripts/verify_files.py
      - name: Check format and generated interface
        run: |
          moon fmt
          moon info
          git diff --exit-code
